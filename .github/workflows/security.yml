name: Guvenlik Kontrolu

# Bu workflow ne zaman çalışsın?
# Hem push yapıldığında hem de Pull Request açıldığında çalışsın.
on:
  push:
  pull_request:

jobs:
  # İşin adı (Status Check kısmında bu isim görünecek)
  basit-tarama:
    runs-on: ubuntu-latest  # GitHub'ın sağladığı sanal Ubuntu makinesinde çalış
    steps:
      
      # 1. Adım: Tarama başlangıç çıktısı
      - name: Ekrana Mesaj Yaz
        run: echo "Güvenlik Taraması Başlıyor"

      # 2. Adım: Kodları makineye çek (Checkout)
      # SHA Hash ile sabitleme (Pinning) yapıldı!
      - name: Kodlari Cek (Checkout)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        
      - name: Semgrep Security Scan
        # returntocorp/semgrep-action@v1 kullanıyoruz
        uses: returntocorp/semgrep-action@713632028d9ae02b2071137a78d2747f53dfb944 # v1.34.1 (Pinning!)
        with:
          # Görev: Sadece Javascript ve Typescript tara
          # Görev: "High" bulgularda fail et
          # Not: Semgrep Action varsayılan olarak bulgu bulduğunda hata verir (auditOn: push)
          # Ancak özellikle sadece hatalarda durmasını garantiye almak için açıklama ekliyoruz.
          config: >- 
            p/javascript
            p/typescript
          
